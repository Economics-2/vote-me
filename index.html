<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভোটার তথ্য অনুসন্ধান - কিশোরগঞ্জ সদর</title>
    <style>
        /* মোবাইল রেসপন্সিভ ডিজাইন */
        :root {
            --primary-color: #006a4e; /* পতাকার সবুজ */
            --secondary-color: #f42a41; /* পতাকার লাল */
            --accent-color: #ffcc00; /* হাইলাইট কালার */
        }

        body {
            font-family: 'SolaimanLipi', 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
        }

        .mobile-container {
            width: 100%;
            max-width: 480px; /* মোবাইলের মত সাইজ */
            background: white;
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            overflow-x: hidden;
        }

        /* হেডার সেকশন */
        .header {
            background: var(--primary-color);
            color: white;
            text-align: center;
            padding: 20px 10px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            position: relative;
        }

        .candidate-img-box {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            margin: 0 auto;
            overflow: hidden;
            background: #fff;
        }

        .candidate-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .symbol-badge {
            position: absolute;
            bottom: 50px;
            right: 35%;
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            padding: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .header h2 {
            margin: 10px 0 5px;
            font-size: 1.2rem;
        }
        
        .header p {
            font-size: 0.9rem;
            opacity: 0.9;
            margin: 0;
        }

        /* ফর্ম সেকশন */
        .search-box {
            padding: 20px;
            margin-top: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box; /* ফিক্স */
        }

        .btn-search {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-search:hover {
            background: #00523c;
        }

        /* রেজাল্ট কার্ড */
        #resultArea {
            padding: 20px;
            display: none; /* প্রথমে লুকানো থাকবে */
        }

        .voter-card {
            border: 2px solid var(--primary-color);
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
        }

        .card-header {
            background: #eaffea;
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .card-body {
            padding: 15px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .info-row {
            display: flex;
            margin-bottom: 5px;
        }
        .info-label {
            font-weight: bold;
            width: 110px;
            flex-shrink: 0;
        }

        .center-alert {
            background: var(--accent-color);
            color: #000;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 0.8rem;
            color: #777;
        }

        /* এনিমেশন */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate {
            animation: fadeIn 0.5s ease-out;
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <div class="header">
        <div class="candidate-img-box">
            <img src="https://via.placeholder.com/150/006a4e/FFFFFF?text=Candidate" id="candidatePhoto" alt="প্রার্থী">
        </div>
        <img src="https://via.placeholder.com/50/ffcc00/000000?text=Marka" class="symbol-badge" id="symbolPhoto" alt="প্রতীক">
        
        <h2 id="candidateName">জননেতা জনাব মো: আব্দুল্লাহ</h2>
        <p>মেয়র পদপ্রার্থী, কিশোরগঞ্জ পৌরসভা</p>
    </div>

    <div class="search-box">
        <div style="background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
            <h3 style="text-align: center; color: var(--primary-color); margin-top:0;">ভোটার তথ্য অনুসন্ধান</h3>
            
            <div class="form-group">
                <label>ওয়ার্ড নির্বাচন করুন</label>
                <select id="wardSelect" class="form-control">
                    <option value="">-- ওয়ার্ড বাছাই করুন --</option>
                    <option value="1">ওয়ার্ড নং ১</option>
                    <option value="2">ওয়ার্ড নং ২</option>
                    <option value="3">ওয়ার্ড নং ৩</option>
                    <option value="4">ওয়ার্ড নং ৪</option>
                    <option value="5">ওয়ার্ড নং ৫</option>
                    <option value="6">ওয়ার্ড নং ৬</option>
                    <option value="7">ওয়ার্ড নং ৭</option>
                    <option value="8">ওয়ার্ড নং ৮</option>
                    <option value="9">ওয়ার্ড নং ৯</option>
                </select>
            </div>

            <div class="form-group">
                <label>জাতীয় পরিচয়পত্র / ভোটার নং (শেষ ৪ ডিজিট)</label>
                <input type="number" id="voterIdInput" class="form-control" placeholder="উদাহরণ: 1025">
                <small style="color: #666; display:block; margin-top:5px;">পরীক্ষার জন্য ১০১০ থেকে ১১০০ এর মধ্যে যেকোনো সংখ্যা দিন</small>
            </div>

            <button onclick="searchVoter()" class="btn-search">অনুসন্ধান করুন</button>
        </div>
    </div>

    <div id="resultArea">
        </div>

    <div class="footer">
        কারিগরি সহযোগিতায়: আইসিটি ল্যাব, কিশোরগঞ্জ
    </div>
</div>

<script>
    // --- কনফিগারেশন: এখানে নাম ও ছবি পরিবর্তন করতে পারবেন ---
    const config = {
        candidateName: "জননেতা জনাব মোঃ মঞ্জুরুল হক",
        designation: "সংসদ সদস্য পদপ্রার্থী",
        candidateImgUrl: "1.jpg", // ডামি ছবি
        symbolImgUrl: "2.jpg" // ডামি প্রতীক
    };

    // পেজ লোড হলে নাম ও ছবি সেট হবে
    document.getElementById('candidateName').innerText = config.candidateName;
    document.querySelector('.header p').innerText = config.designation;
    document.getElementById('candidatePhoto').src = config.candidateImgUrl;
    document.getElementById('symbolPhoto').src = config.symbolImgUrl;


    // --- ডামি ডাটা জেনারেশন (১০০ জন ভোটার) ---
    const voters = [];
    const centers = [
        "কিশোরগঞ্জ সরকারি বালক উচ্চ বিদ্যালয়", 
        "আজিম উদ্দিন উচ্চ বিদ্যালয়", 
        "সরকারি মহিলা কলেজ কেন্দ্র",
        "SV সরকারি বালিকা উচ্চ বিদ্যালয়",
        "খড়মপট্টি সরকারি প্রাথমিক বিদ্যালয়",
        "গাইটাল সরকারি প্রাথমিক বিদ্যালয়",
        "বত্রিশ সরকারি প্রাথমিক বিদ্যালয়",
        "হারুয়া মডেল স্কুল",
        "নীলগঞ্জ সরকারি প্রাথমিক বিদ্যালয়"
    ];

    // ১০০টি কাল্পনিক ডাটা তৈরি করছি
    for (let i = 1; i <= 100; i++) {
        let ward = (i % 9) + 1; // ১ থেকে ৯ ওয়ার্ড
        voters.push({
            id: (1009 + i).toString(), // ভোটার আইডি ১০১০ থেকে শুরু
            name: i % 2 === 0 ? "মোঃ রহিম উদ্দিন" : "মোছা: ফাতেমা বেগম",
            father: "মৃত আব্দুল করিম",
            mother: "রাহেলা খাতুন",
            ward: ward.toString(),
            serial: 2000 + i,
            dob: "01/01/1985",
            center: centers[ward - 1] // ওয়ার্ড অনুযায়ী কেন্দ্র
        });
    }

    // --- সার্চ ফাংশন ---
    function searchVoter() {
        const selectedWard = document.getElementById('wardSelect').value;
        const inputId = document.getElementById('voterIdInput').value;
        const resultArea = document.getElementById('resultArea');

        // ভ্যালিডেশন
        if (!selectedWard || !inputId) {
            alert("দয়া করে ওয়ার্ড এবং ভোটার নম্বর দিন।");
            return;
        }

        // ডাটা খোঁজা
        const foundVoter = voters.find(v => v.ward === selectedWard && v.id.includes(inputId));

        if (foundVoter) {
            // কার্ড তৈরি
            resultArea.innerHTML = `
                <div class="voter-card animate">
                    <div class="card-header">
                        <h3 style="margin:0; color: #006a4e;">আপনার ভোট কেন্দ্র</h3>
                    </div>
                    
                    <div class="center-alert">
                        কেন্দ্র: ${foundVoter.center}
                    </div>

                    <div class="card-body">
                        <div class="info-row">
                            <div class="info-label">নাম:</div>
                            <div>${foundVoter.name}</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label">ভোটার নং:</div>
                            <div style="font-weight:bold; color:red;">${foundVoter.id}</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label">সিরিয়াল নং:</div>
                            <div>${foundVoter.serial}</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label">পিতা/স্বামী:</div>
                            <div>${foundVoter.father}</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label">মাতা:</div>
                            <div>${foundVoter.mother}</div>
                        </div>
                        <div class="info-row">
                            <div class="info-label">ঠিকানা:</div>
                            <div>গ্রাম: গাইটাল, ওয়ার্ড: ${foundVoter.ward}, কিশোরগঞ্জ সদর।</div>
                        </div>
                    </div>
                    
                    <button onclick="window.print()" style="width:100%; padding:10px; background:#333; color:#fff; border:none; cursor:pointer;">
                        🖨️ প্রিন্ট বা স্ক্রিনশট নিন
                    </button>
                </div>
            `;
            resultArea.style.display = 'block';
        } else {
            resultArea.innerHTML = `
                <div style="text-align:center; padding:20px; color:red;" class="animate">
                    <h3>দুঃখিত! কোনো তথ্য পাওয়া যায়নি।</h3>
                    <p>সঠিক ওয়ার্ড এবং ভোটার নম্বর দিয়ে আবার চেষ্টা করুন।</p>
                </div>
            `;
            resultArea.style.display = 'block';
        }
    }
</script>

</body>
</html>
